name: Regenerar paginas y catalogos

# Regenera las paginas de producto, los catalogos de Meta y el sitemap desde el Sheet,
# para que precios, stock y productos nuevos se reflejen sin depender de ningun computador.
# - Automatico: cada 3 horas.
# - Manual: pestana Actions > "Regenerar paginas y catalogos" > Run workflow (tambien desde la app de GitHub en el celular).
# Si la revision de seguridad falla, NO publica nada.

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      saltar_compuerta:
        description: "Saltar la compuerta de calidad (SOLO emergencias)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: regenerar
  cancel-in-progress: false

jobs:
  regenerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerar desde el Sheet
        run: python3 scripts/generate_product_pages.py

      - name: Revision de seguridad
        run: python3 scripts/check_generated.py

      # COMPUERTA DE CALIDAD (nov 2026): revisa los archivos recien generados (Pixel, precios, WhatsApp, boton de compra,
      # talla, confirmacion, estilos UX, sitemap, feed...). Si falla, el trabajo termina en ROJO y NO se publica nada.
      # No usa internet, asi que una caida pasajera de la red no la frena. Solo para emergencias: al correrla a mano
      # (Run workflow) se puede marcar "saltar_compuerta".
      - name: Compuerta de calidad (si falla, NO se publica)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.saltar_compuerta) }}
        run: python3 scripts/auditoria.py --solo-archivos

      - name: Publicar solo si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A orkia nudo feeds sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios: no se publica nada."
          else
            git commit -m "Regenerar paginas y catalogos desde el Sheet"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
